# T30: деплой API (T28) и Telegram-бота (T27) на сервер (docs/BOT_DEPLOY.md).
# Запуск: Actions → deploy-bot → Run workflow. mode=probe только смотрит сервер, ничего не меняя.
name: deploy-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe — осмотреть сервер; deploy — выкатить бота'
        type: choice
        options: [deploy, probe]
        default: deploy

concurrency:
  group: deploy-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты бота
        working-directory: bot
        run: npm test
      - name: Тесты API, ядра и клиентов моделей
        run: node --test core/*.test.mjs server/*.test.mjs integrations/gemini/*.test.mjs integrations/openai/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
      SERVER_HOST: ${{ vars.BOT_SERVER_HOST }}
      SERVER_USER: ${{ vars.BOT_SERVER_USER }}
      SERVER_PORT: ${{ vars.BOT_SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.BOT_SERVER_PASSWORD }}
      BOT_TELEGRAM_TOKEN: ${{ secrets.BOT_TELEGRAM_TOKEN }}
      # Пусто — бот ходит в API на этом же сервере.
      TRAINER_API_URL: ${{ vars.TRAINER_API_URL || 'http://127.0.0.1:8080' }}
      # Модель: OPENAI_API_KEY (ChatGPT, основной) или GEMINI_API_KEY. Без ключей API в demo, бот не распознаёт голос/PDF/фото.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-argon' }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка настроек
        run: |
          missing=""
          [ -n "$SERVER_HOST" ] || missing="$missing Variable:BOT_SERVER_HOST"
          [ -n "$SERVER_USER" ] || missing="$missing Variable:BOT_SERVER_USER"
          [ -n "$SSHPASS" ] || missing="$missing Secret:BOT_SERVER_PASSWORD"
          if [ "$MODE" = deploy ] && [ -z "$BOT_TELEGRAM_TOKEN" ]; then missing="$missing Secret:BOT_TELEGRAM_TOKEN"; fi
          if [ -n "$missing" ]; then echo "::error::Не заданы:$missing (Settings → Secrets and variables → Actions)"; exit 1; fi

      - name: Проверка токена Telegram (getMe)
        if: inputs.mode == 'deploy'
        run: |
          code=$(curl -s -o me.json -w '%{http_code}' "https://api.telegram.org/bot${BOT_TELEGRAM_TOKEN}/getMe")
          if [ "$code" != 200 ]; then echo "::error::Telegram отклонил токен (HTTP $code)"; exit 1; fi
          python3 -c "import json;r=json.load(open('me.json'))['result'];print('Бот: @'+r['username'])"
          rm -f me.json

      - name: Какие ключи заданы в Actions (только да/нет, без значений)
        env:
          S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S_OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          S_CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          S_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_BOT_TELEGRAM_TOKEN: ${{ secrets.BOT_TELEGRAM_TOKEN }}
          S_BOT_SERVER_PASSWORD: ${{ secrets.BOT_SERVER_PASSWORD }}
          S_SITE_SERVER_PASSWORD: ${{ secrets.SITE_SERVER_PASSWORD }}
          V_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          V_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          V_GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          V_TRAINER_API_URL: ${{ vars.TRAINER_API_URL }}
          V_SITE_SERVER_HOST: ${{ vars.SITE_SERVER_HOST }}
        run: |
          for n in OPENAI_API_KEY OPENAI_KEY CHATGPT_API_KEY GEMINI_API_KEY GOOGLE_API_KEY ANTHROPIC_API_KEY BOT_TELEGRAM_TOKEN BOT_SERVER_PASSWORD SITE_SERVER_PASSWORD; do
            v="S_$n"; [ -n "${!v}" ] && echo "Secret $n: задан" || echo "Secret $n: нет"
          done
          for n in OPENAI_MODEL OPENAI_BASE_URL GEMINI_MODEL TRAINER_API_URL SITE_SERVER_HOST; do
            v="V_$n"; echo "Variable $n: ${!v:-нет}"
          done

      - name: Выбор модели OpenAI
        if: env.OPENAI_API_KEY != ''
        run: |
          # Без Variable OPENAI_MODEL берём первую доступную ключу модель из списка (имя модели — не секрет).
          code=$(curl -s -o models.json -w '%{http_code}' https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY")
          if [ "$code" != 200 ]; then echo "::error::OpenAI отклонил ключ (HTTP $code)"; rm -f models.json; exit 1; fi
          chosen=$(python3 - "$OPENAI_MODEL" <<'PY'
          import json, sys
          ids = {m.get('id') for m in json.load(open('models.json')).get('data', [])}
          wanted = sys.argv[1]
          if wanted:
              print(wanted if wanted in ids else ''); raise SystemExit
          for m in ['gpt-6.1-sol', 'gpt-4.1-mini', 'gpt-4o-mini', 'gpt-5-mini', 'gpt-4.1', 'gpt-4o', 'gpt-5']:
              if m in ids: print(m); break
          PY
          )
          rm -f models.json
          [ -n "$chosen" ] || { echo "::error::Нет подходящей модели OpenAI (Variable OPENAI_MODEL или список по умолчанию)"; exit 1; }
          echo "Модель OpenAI: $chosen"
          echo "OPENAI_MODEL=$chosen" >> "$GITHUB_ENV"

      - name: Проверка модели реальным вызовом
        if: env.OPENAI_API_KEY != '' && inputs.mode == 'deploy'
        run: |
          # Один короткий запрос JSON — как его делает ядро. Ключ и тексты в журнал не попадают.
          node --input-type=module -e "
            import { createOpenAIClientFromEnv } from './integrations/openai/client.mjs';
            const c = createOpenAIClientFromEnv(process.env, { timeoutMs: 30000, maxOutputTokens: 1024 });
            const t = Date.now();
            try {
              const r = await c.generateJSON({ prompt: 'Верни JSON {\"ok\": true}', schema: { type: 'object', properties: { ok: { type: 'boolean' } }, required: ['ok'] } });
              console.log('Модель ' + r.modelVersion + ' ответила за ' + (Date.now() - t) + ' мс, ok=' + r.data.ok + ', токенов ' + r.usage.totalTokens);
            } catch (e) { console.log('::error::Модель не ответила: ' + e.code + ' — ' + e.message); process.exit(1); }
          "

      - name: Проверка тренера на настоящей модели (только баллы)
        if: env.OPENAI_API_KEY != '' && inputs.mode == 'deploy'
        run: |
          node --input-type=module -e "
            import { createOpenAIClientFromEnv } from './integrations/openai/client.mjs';
            import { createCoach } from './bot/src/coach.mjs';
            const coach = createCoach({ llm: createOpenAIClientFromEnv(process.env, { timeoutMs: 30000, maxOutputTokens: 2048 }) });
            const pitch = 'ЛабСклад — сервис, через который вузовские лаборатории сдают друг другу в аренду простаивающее оборудование. Дорогие приборы загружены на 30%. 23 интервью с заведующими лабораториями в 6 вузах, 17 из 23 готовы сдавать. Пилот в двух лабораториях: 9 бронирований за 6 недель. 12% комиссии с аренды, средний чек 18 000 рублей.';
            try {
              const p = await coach.evaluatePitch(pitch);
              console.log('Питч: ' + p.total + '/100, уровень ' + p.level + ', kind=' + p.kind + ', баллы ' + p.scores.join(','));
              const a = await coach.evaluateAnswer({ pitch, question: 'Кто внутри вуза подписывает договор аренды?', answer: 'Не знаю, потом разберёмся' });
              console.log('Ответ-отписка: ' + a.total + '/20, evasive=' + a.evasive);
              if (p.kind !== 'pitch' || p.total < 20 || !a.evasive) { console.log('::warning::Тренер ответил неожиданно — проверьте промпты'); }
            } catch (e) { console.log('::error::Тренер не ответил: ' + (e.code || '') + ' ' + e.message); process.exit(1); }
          "

      - name: SSH-клиент и ключ хоста
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "$SERVER_PORT" "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Сервер $SERVER_HOST:$SERVER_PORT не отвечает по SSH"; exit 1; }
          echo "Отпечатки ключа хоста (сверить при первом входе):"
          ssh-keygen -lf ~/.ssh/known_hosts
          printf '%s\n' \
            'Host bot' \
            "  HostName $SERVER_HOST" \
            "  User $SERVER_USER" \
            "  Port $SERVER_PORT" \
            '  StrictHostKeyChecking yes' \
            '  PreferredAuthentications password' \
            '  PubkeyAuthentication no' \
            '  ConnectTimeout 20' \
            '  ServerAliveInterval 15' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Осмотр сервера
        run: |
          sshpass -e ssh bot 'set +e
            . /etc/os-release 2>/dev/null; echo "ОС: ${PRETTY_NAME:-?}"
            echo "Ядро: $(uname -r)  Арх: $(uname -m)"
            echo "Node: $(node -v 2>/dev/null || echo нет)"
            echo "systemd: $(systemctl --version 2>/dev/null | head -1 || echo нет)"
            echo "Диск:"; df -h / | tail -1
            echo "Память:"; free -m | head -2
            echo "Сервис бота: $(systemctl is-active investor-bot 2>/dev/null; true)"
            echo "Сервис API: $(systemctl is-active investor-api 2>/dev/null; true)"
            echo "Порты 8080/8081:"; ss -ltnp 2>/dev/null | grep -E ":(8080|8081)\\b" || echo "свободны"'
          if [ -n "$OPENAI_API_KEY" ]; then echo "Модель: OpenAI ($OPENAI_MODEL)"; elif [ -n "$GEMINI_API_KEY" ]; then echo "Модель: Gemini"; else echo "::warning::Нет OPENAI_API_KEY и GEMINI_API_KEY — API в режиме demo, голос/PDF/фото в боте не распознаются"; fi

      - name: Выкатить бота
        if: inputs.mode == 'deploy'
        run: |
          tar -czf investor-bot.tgz bot core server integrations deploy content/investor/assets content/investor/investors.json
          sshpass -e scp -q investor-bot.tgz bot:/tmp/investor-bot.tgz
          # Настройки передаются через stdin: токен не попадает в аргументы команд и в журнал.
          {
            printf 'BOT_TELEGRAM_TOKEN=%s\n' "$BOT_TELEGRAM_TOKEN"
            printf 'BOT_HEALTH_PORT=8081\n'
            printf 'TRAINER_API_URL=%s\n' "$TRAINER_API_URL"
            printf 'NODE_ENV=production\n'
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL"
          } | sshpass -e ssh bot 'umask 077; cat > /tmp/investor-bot.env'
          {
            printf 'NODE_ENV=production\n'
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "$GEMINI_MODEL"
          } | sshpass -e ssh bot 'umask 077; cat > /tmp/investor-api.env'
          sshpass -e ssh bot 'bash -s' < deploy/bot/remote-install.sh
